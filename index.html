<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formatura de Psicologia — UniViçosa</title>
  
  <!-- Fontes de Alta Caligrafia e Tipografia Editorial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Elementos artísticos de fundo (Psicologia e Brilhos) -->
  <div class="art-backdrop">
    <span class="symbol psi p1">Ψ</span>
    <span class="symbol psi p2">Ψ</span>
    <span class="symbol psi p3">Ψ</span>
    <span class="symbol star s1">✨</span>
    <span class="symbol star s2">✨</span>
    <span class="symbol star s3">✨</span>
    <div class="light-grain"></div>
  </div>

  <!-- Pôster Principal -->
  <main class="poster-frame">
    <div class="inner-border">
      
      <header class="header">
        <p class="institution">UniViçosa • Turma de Psicologia</p>
        <div class="divider-line">
          <span class="center-symbol">Ψ</span>
        </div>
      </header>

      <section class="body-content">
        <span class="calligraphy-lead">Rumo ao grande dia</span>
        <h1 class="main-title">A Nossa Formatura</h1>
        <p class="target-date">11 • Dezembro • 2026</p>

        <!-- Contagem Linear Orgânica -->
        <div class="linear-countdown" id="countdown" data-target="2026-12-11T00:00:00">
          <div class="unit">
            <span class="num" id="days">00</span>
            <span class="lbl">dias</span>
          </div>
          <span class="dot">·</span>
          <div class="unit">
            <span class="num" id="hours">00</span>
            <span class="lbl">horas</span>
          </div>
          <span class="dot">·</span>
          <div class="unit">
            <span class="num" id="minutes">00</span>
            <span class="lbl">min</span>
          </div>
          <span class="dot">·</span>
          <div class="unit">
            <span class="num" id="seconds">00</span>
            <span class="lbl">seg</span>
          </div>
        </div>

        <p class="poetic-text">
          Estamos chegando ao fim de mais uma etapa! ✨<br />
          O diploma e o CRP estão logo ali, rs
        </p>
      </section>

      <footer class="footer">
        <span class="footer-psi">Ψ</span>
      </footer>

    </div>
  </main>

  <!-- Visual quando zerar o cronômetro -->
  <div id="final-screen" class="final-screen hidden">
    <canvas id="confetti-canvas"></canvas>
    <div class="final-box">
      <span class="final-psi">Ψ</span>
      <h2 class="final-calligraphy">Enfim, Psicólogos</h2>
      <p class="final-sub">Parabéns à melhor turma da UniViçosa! ✨</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
